<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Team scheduling and operations.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Axis Team">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Axis Team</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Stop the browser's two-finger swipe "Back / Forward" gesture on Mac
    trackpads, so sideways swipes scroll the app (schedule, tables) instead of
    leaving the page. The CSS covers Chrome / Edge / Firefox; the wheel
    listener covers Safari. Flutter still receives the events.
  -->
  <style>
    html, body {
      overscroll-behavior: none;
      overscroll-behavior-x: none;
    }
  </style>
  <script>
    window.addEventListener('wheel', function (e) {
      if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) e.preventDefault();
    }, { passive: false });
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        for (var reg of regs) { reg.unregister(); }
      });
      if ('caches' in window) {
        caches.keys().then(function (names) {
          for (var name of names) { caches.delete(name); }
        });
      }
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js?v=0.9.5" async></script>
</body>
</html>
